{{- /* Favicon and app icons */ -}}
{{- $favicon := .Site.Params.favicon -}}
{{- if not $favicon -}}
  {{- $favicon = "images/avatar.png" -}}
{{- end -}}
<link rel="icon" href="{{ $favicon | relURL }}">
<link rel="apple-touch-icon" href="{{ $favicon | relURL }}">
{{- with .Site.Params.assets.favicon }}
<link rel="icon" type="image/png" sizes="32x32" href="{{ . | relURL }}">
{{- end }}
