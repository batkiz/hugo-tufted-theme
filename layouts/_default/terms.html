{{ define "main" }}
  {{ partial "components/page-header.html" (dict "page" . "isSingle" false "showMeta" false) }}

  <section class="page-list taxonomy-cloud">
    {{ range .Data.Terms.Alphabetical }}
      <article class="post-tile">
        <h3><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a></h3>
        <p>{{ .Count }} {{ cond (eq .Count 1) "post" "posts" }}</p>
      </article>
    {{ end }}
  </section>
{{ end }}
