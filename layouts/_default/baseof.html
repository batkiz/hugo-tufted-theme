<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "zh-CN" }}">
  {{ partial "head.html" . }}
  <body
    class="site-page kind-{{ .Kind }}"
    data-theme-toggle="{{ if .Site.Params.options.showDarkMode | default site.Params.showThemeToggle | default true }}true{{ else }}false{{ end }}"
  >
    {{ partial "header.html" . }}
    <main class="site-main">
      <article class="content-shell">
        {{ block "main" . }}{{ end }}
      </article>
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
